# Lets clamd read every file for the daily clamdscan --multiscan run without
# running as root. clamd starts as the clamav user with read/traverse
# permission only (CAP_DAC_READ_SEARCH); it cannot write or modify anything
# it otherwise could not.
[Service]
User=clamav
Group=clamav
AmbientCapabilities=CAP_DAC_READ_SEARCH
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
# Private TemporaryDirectory for clamd.conf (excluded from scans). Created with
# full privileges ("+") so a missing or tampered dir is reset to clamav-only.
ExecStartPre=+/usr/bin/install -d -o clamav -g clamav -m 0700 /var/lib/clamav/tmp
